name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Debug profile on purpose: upstream ships a debug build because the release build crashes.
      - run: cargo build -p er-archipelago --locked
      - uses: actions/upload-artifact@v4
        with:
          name: er_archipelago-jp
          path: target/debug/er_archipelago.dll
